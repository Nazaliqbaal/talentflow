# This file defines the entire CI/CD pipeline.
# GitHub reads this file automatically whenever you push code.

name: TalentFlow CI/CD

# ── TRIGGERS ──────────────────────────────────────────────────────────────────
# "on" defines WHEN this pipeline runs.
on:
  push:
    branches:
      - main          # Run the full pipeline when code is pushed to main
  pull_request:
    branches:
      - main          # Run only the CI (test/build) step when a PR targets main.
                      # This catches broken code before it gets merged.

# ── JOBS ──────────────────────────────────────────────────────────────────────
# A pipeline is made of "jobs". Each job runs on its own fresh virtual machine.
# Jobs run in parallel by default unless you use "needs" to chain them.
jobs:

  # ── JOB 1: Test & Build Backend ─────────────────────────────────────────────
  build-backend:
    name: Build & Test Backend
    runs-on: ubuntu-latest    # GitHub spins up a fresh Ubuntu VM for this job

    steps:
      # Step 1: Check out your code onto the VM
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install .NET on the VM
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Step 3: Restore (download) NuGet packages
      - name: Restore dependencies
        run: dotnet restore
        working-directory: backend

      # Step 4: Build the project — catches compile errors
      - name: Build
        run: dotnet build --no-restore --configuration Release
        working-directory: backend

      # Step 5: Run tests — if any test fails, the pipeline stops here.
      # Nothing gets deployed if tests are broken.
      - name: Test
        run: dotnet test --no-build --configuration Release
        working-directory: backend

  # ── JOB 2: Test & Build Frontend ────────────────────────────────────────────
  build-frontend:
    name: Build & Test Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"                      # Cache node_modules between runs — speeds up the pipeline
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci                         # "ci" is stricter than "install" — uses exact versions from lockfile
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:5143  # Needed so Vite doesn't fail on missing env var

  # ── JOB 3: Push Docker Images ───────────────────────────────────────────────
  # This job only runs on pushes to main (not on PRs).
  # It also only runs if BOTH build jobs above passed — "needs" enforces this.
  push-images:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]  # Wait for both build jobs to pass first

    # Skip this job on pull requests — only push images from main branch code
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Log in to Docker Hub using secrets stored in GitHub.
      # Secrets are set in: GitHub repo → Settings → Secrets and variables → Actions
      # Never hardcode credentials here — GitHub masks secrets in logs automatically.
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # "docker/metadata-action" automatically generates smart image tags.
      # On main branch it tags as "latest" plus the git commit SHA (e.g. sha-a1b2c3d).
      # The SHA tag is important — it lets you roll back to any exact version.
      - name: Generate backend image tags
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/talentflow-backend
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Generate frontend image tags
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/talentflow-frontend
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      # Build and push backend image
      - name: Build & Push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}

      # Build and push frontend image — pass VITE_API_URL as a build arg
      - name: Build & Push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}

  # ── JOB 4: Deploy to Kubernetes ─────────────────────────────────────────────
  # Runs after images are pushed. Updates K8s to use the new images.
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [push-images]    # Only deploy if images were pushed successfully

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Configure kubectl to talk to your cluster.
      # KUBE_CONFIG is the contents of your ~/.kube/config file, stored as a secret.
      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config

      # Apply all K8s manifests — K8s updates only what changed.
      - name: Apply K8s manifests
        run: kubectl apply -f k8s/

      # Force pods to pull the new "latest" image.
      # Without this, K8s won't restart pods because the tag name didn't change.
      - name: Rollout new images
        run: |
          kubectl rollout restart deployment/backend
          kubectl rollout restart deployment/frontend

      # Wait until the new pods are fully running before marking the pipeline green.
      # If the new pods crash, this step fails and you get notified.
      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/backend --timeout=120s
          kubectl rollout status deployment/frontend --timeout=120s
